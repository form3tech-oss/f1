scenario: test
default:
  jitter: 0
  distribution: none
limits:
  max-duration: 5s
  concurrency: 50
  max-iterations: 1000
  ignore-dropped: true
stages:
  # [0ms] one user. Its iteration runs past the end of the stage, and the stage waits for it.
  - duration: 100ms
    mode: users
    concurrency: 1
    parameters:
      DRIFT_STAGE: users
  # [100ms] starts late, when the users stage's iteration ends at 200ms. 200ms: 1
  - duration: 400ms
    mode: constant
    rate: 1/1s
    parameters:
      DRIFT_STAGE: shortened
  # [500ms] 0ms: 1; 100ms: 1. Starts on schedule, as the stage before was shortened.
  - duration: 200ms
    mode: constant
    rate: 1/100ms
    parameters:
      DRIFT_STAGE: on-schedule
