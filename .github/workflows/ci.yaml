on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: version
        id: version
        uses: codacy/git-version@877bb11b7a2ee44dcd7c0a03882c7037356e64e9 # v2.8.6
        with:
          prefix: "v"
          minor-identifier: /feat(\([\w\d]+\))?:/
          major-identifier: /^\s*BREAKING(\s+CHANGE)?:/
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Install gorelease
        run: go install golang.org/x/exp/cmd/gorelease@v0.0.0-20260812173653-3d80eb74bc5b
      - name: verify-version
        run: echo "Comparing ${{ steps.version.outputs.previous-version }} to ${{ steps.version.outputs.version }}"; gorelease -base ${{ steps.version.outputs.previous-version }} -version ${{ steps.version.outputs.version }}
  Test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: test
        run: |
          make lint
          make test
